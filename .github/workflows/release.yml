name: Release

# Push a version tag on stable to publish a GitHub Release:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
# Tags with a hyphen (v0.2.0-beta.1) are published as pre-releases.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
